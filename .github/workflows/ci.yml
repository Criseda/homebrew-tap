# Lints and audits every formula and cask in the tap, and installs and
# tests every formula, on each push to main and each pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  check:
    name: check
    runs-on: macos-26
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      # Audit the commit under test, not the published tap.
      - name: Tap this checkout
        run: |
          mkdir -p "$(dirname "$(brew --repository criseda/tap)")"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository criseda/tap)"
          brew trust criseda/tap

      - name: Style
        run: brew style criseda/tap

      - name: Audit
        run: brew audit --strict --online --tap criseda/tap

      - name: Install and test every formula
        run: |
          for file in Formula/*.rb; do
            formula="criseda/tap/$(basename "$file" .rb)"
            brew install "$formula"
            brew test "$formula"
          done
